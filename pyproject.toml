[project]
name = "rag_app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamed Akram", email = "mohamedakram4121@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.1",
    "fastembed>=0.9.0",
    "google-genai>=2.30.1",
    "httpx2>=2.13.1",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.0",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rag_app = "rag_app:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
